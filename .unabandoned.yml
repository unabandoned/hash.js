schema: 1

package: "@unabandoned/hash.js"

upstream:
  repo: indutny/hash.js
  reason: "no release since 2018-11-30; issues unanswered"

summary: >-
  Pure-JavaScript hash functions - MD5, SHA-1, the SHA-2 family including
  SHA-512/256, RIPEMD-160, and HMAC over any of them - that run identically in
  Node and the browser, with no reliance on WebCrypto or node:crypto and no
  dependencies of its own.

why-forked: >-
  @unabandoned/json-to-ts uses its SHA-1 to content-address type descriptions,
  and IT-Tools ships that in a browser bundle where node:crypto is stubbed out
  and WebCrypto's async digest cannot be used. The maintained alternatives do
  not fit: @noble/hashes 2.x is ESM-only and this tree is CommonJS, and sha.js
  drags in to-buffer's typed-array helpers. Adopted so the sole abandoned node
  in that chain is one we own, with its two leaves (minimalistic-assert at ten
  lines, inherits at fifteen) vendored rather than depended on - so the package
  declares no runtime dependencies at all.

status: active

used-by:
  - consumer: unabandoned/json-to-ts
    purpose: "SHA-1 content addressing for deduplicating generated type descriptions."

tags: [hash, sha, hmac, crypto, browser]
